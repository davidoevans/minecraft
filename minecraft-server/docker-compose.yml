version: '3.3'
# See https://raw.githubusercontent.com/itzg/docker-rcon-web-admin/master/docker-compose.yml
services:
  web:
    image: itzg/rcon
    environment:
      RWA_USERNAME: admin
      RWA_PASSWORD: admin
      RWA_ADMIN: "TRUE"
      # is referring to the hostname of 'mc' compose service below
      RWA_RCON_HOST: mc
      # needs to match the password configured for the container, which is 'minecraft' by default
      RWA_RCON_PASSWORD: minecraft
    ports:
      - 4326:4326
      - 4327:4327
  mc:
    image: itzg/minecraft-server:java8
    ports:
      - 25565:25565
      - 25575:25575
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      ENABLE_RCON: "True"
      ENABLE_QUERY: "True"
      ENABLE_COMMAND_BLOCK: "True"
      GENERATE_STRUCTURES: "True"
      MODE: "survival"
      MOTD: "Evans Family Minecraft Server"
      LEVEL_TYPE: "normal"
      DIFFICULTY: "peaceful"
#      REMOVE_OLD_MODS: "False"
    volumes:
      - ./minecraft_data:/data

volumes:
  mincraft-data:

